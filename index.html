<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RPG Simple Dice</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f1f1f">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg-dark: #2c2c2c; 
            --bg-bottom: #1f1f1f;
            --card-modal: #383838;
            --input-bg: #222222;
            --accent-orange: #fca311;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border-line: #3d3d3d;
        }

        * {
            box-sizing: border-box;
            font-family: Roboto, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            background-color: #000000;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-screen {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .app-header {
            background-color: var(--bg-bottom); 
            padding: 24px 14px 0 14px; /* Margem de segurança no topo para afastar da barra do telemóvel */
            text-align: left;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .app-subtitle {
            display: block;
            text-align: left;
            font-size: 1rem;
            color: var(--text-sub);
            margin-top: 5px;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: -6px;
        }

        .icon-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn svg { width: 24px; height: 24px; display: block; }

        .tabs {
            display: flex;
            margin-top: 6px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 16px 0;
            font-size: 0.8rem;
            font-weight: bold;
            color: #808080;
            cursor: pointer;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--text-main);
            border-bottom: 2px solid #ffffff;
        }

        .content-area {
            flex: 1;
            padding: 0; 
            overflow-y: auto;
            overflow-x: hidden;
        }

        .dice-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 19px 0px; 
            padding-top: 9px;
            justify-items: center;
            width: 100%;
        }

        .dice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 82px;
            padding: 2px 0;
            border-radius: 8px;
            background: transparent;
            position: relative;
        }

        .dice-item:active::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            pointer-events: none;
        }

        .dice-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .dice-label {
            margin-top: 7px;
            font-size: 0.9rem; 
            font-weight: 500;
            color: var(--text-main);
        }

        .android-menu {
            position: absolute;
            top: 55px;
            right: 16px;
            background-color: #383838;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            z-index: 100;
            min-width: 180px;
        }

        .menu-option { padding: 12px 16px; font-size: 0.9rem; color: #ffffff; cursor: pointer; }
        .menu-option:active { background-color: #484848; }

        .result-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 150;
        }

        .result-card {
            background-color: #2e2e2e;
            width: 206px;
            min-height: 192px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px 10px 10px;
            border-radius: 0;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        }

        .result-header { font-size: 1.5rem; line-height: 1.2; color: #ffffff; font-weight: 400; }
        .result-value {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5rem;
            font-weight: 400;
            color: #ffffff;
            line-height: 1;
            margin: 0;
        }
        .result-footer { font-size: 1rem; line-height: 1.2; color: #ffffff; text-align: center; word-break: break-all; max-width: 100%; }

        .bottom-bar {
            background-color: var(--bg-dark);
            padding: 0 8px 8px 8px;
        }

        .bottom-panel {
            display: flex;
            background-color: #262626;
            border-radius: 12px;
            padding: 4px 0;
        }

        .ctrl-group {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
        }

        .ctrl-group + .ctrl-group {
            border-left: 1px solid #333333;
        }

        .btn-ctrl {
            position: relative;
            background-color: #ffffff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Símbolos - e + desenhados em CSS (traço grosso, igual ao app original) */
        .btn-ctrl::before,
        .btn-ctrl::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            background-color: #000000;
            transform: translate(-50%, -50%);
        }

        .btn-ctrl::before { width: 18px; height: 4px; }
        .btn-ctrl.plus::after { width: 4px; height: 18px; }
        .btn-ctrl.minus::after { display: none; }

        .btn-ctrl:active { background-color: var(--accent-orange); }

        .ctrl-value {
            font-size: 1.25rem;
            text-align: center;
            font-weight: 400;
            color: #ffffff;
        }

        #historicoView { padding: 0; }

        .history-list {
            display: flex;
            flex-direction: column;
        }

        .history-item {
            background: #303030;
            padding: 8px 9px;
            display: flex;
            align-items: flex-start;
            border-bottom: 1px solid #4a4a4a;
            position: relative;
        }

        .history-left {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            flex: 1;
            min-width: 0;
        }

        .history-total-box {
            background-color: #242424;
            width: 70px;
            height: 70px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 400;
            color: #ffffff;
        }

        .history-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-top: 2px;
            min-width: 0;
        }

        .history-title { color: #ffffff; font-size: 1.3rem; font-weight: 400; }
        .history-rolls { color: #ffffff; font-size: 0.95rem; word-break: break-word; }

        .history-time {
            position: absolute;
            top: 10px;
            right: 9px;
            font-size: 0.8rem;
            color: #8a8a8a;
        }

        .snackbar {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 50px;
            background-color: #202020;
            color: #ffffff;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            padding: 0 26px;
            transform: translateY(100%);
            transition: transform 0.25s ease;
            pointer-events: none;
            z-index: 300;
        }

        .snackbar.show { transform: translateY(0); }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 200;
        }

        .modal-card {
            background-color: var(--card-modal);
            width: 100%;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }

        .modal-header { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.95rem; margin-bottom: 20px; color: #fff; }
        .modal-header .icon { background-color: var(--accent-orange); color: #000; width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        label.modal-label { font-size: 0.7rem; font-weight: bold; color: var(--text-sub); text-align: center; margin-bottom: 6px; }
        .modal-card input { background-color: var(--input-bg); border: 1px solid var(--border-line); border-radius: 10px; padding: 12px; color: #fff; text-align: center; font-size: 1rem; outline: none; width: 100%; }

        .btn-orange { width: 100%; background-color: var(--accent-orange); color: #000; border: none; border-radius: 10px; padding: 14px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

<div class="app-screen">
    <div class="app-header">
        <div class="header-main">
            <div class="header-text">
                <div class="app-title">RPG Simple Dice</div>
                <div class="app-subtitle">Toque no dado e boa sorte!</div>
            </div>
            <div class="header-icons">
                <div class="icon-btn" onclick="clearHistory()" title="Apagar Histórico">
                    <svg viewBox="0 0 24 24"><path d="M4.5 4.5L19.5 19.5M19.5 4.5L4.5 19.5" stroke="#ffffff" stroke-width="2.2" fill="none"/></svg>
                </div>
                <div class="icon-btn" onclick="toggleMenu(event)">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="3.6" r="2.5" fill="#ffffff"/><circle cx="12" cy="12" r="2.5" fill="#ffffff"/><circle cx="12" cy="20.4" r="2.5" fill="#ffffff"/></svg>
                </div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" id="tabMesa" onclick="switchTab('mesa')">MESA</div>
            <div class="tab" id="tabHist" onclick="switchTab('historico')">HISTÓRICO</div>
        </div>
    </div>

    <div class="android-menu" id="menuPop">
        <div class="menu-option" onclick="openCreateDiceModal()">Dados</div>
        <div class="menu-option" onclick="openSettingsModal()">Configurações</div>
        <div class="menu-option" onclick="alert('RPG Simple Dice v1.0 Custom')">Sobre</div>
        <div class="menu-option" onclick="alert('Obrigado por avaliar!')">Avaliar app</div>
        <div class="menu-option" onclick="alert('Você já é PLUS!')">Go PLUS</div>
    </div>

    <div class="content-area" id="mesaView">
        <div class="dice-grid" id="diceGrid"></div>
    </div>

    <div class="content-area" id="historicoView" style="display:none;">
        <div class="history-list" id="historyList">
            <div style="text-align:center; color: var(--text-sub); margin-top:30px; font-size: 1rem;">Nenhuma rolagem realizada.</div>
        </div>
    </div>

    <div class="result-overlay" id="resultOverlay" onclick="closeResult()">
        <div class="result-card">
            <div class="result-header" id="resHeader">1d20</div>
            <div class="result-value" id="resMain">16</div>
            <div class="result-footer" id="resFooter">16</div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="bottom-panel">
            <div class="ctrl-group">
                <button class="btn-ctrl minus" onclick="changeCount(-1)"></button>
                <span class="ctrl-value" id="countDisplay">1d</span>
                <button class="btn-ctrl plus" onclick="changeCount(1)"></button>
            </div>
            <div class="ctrl-group">
                <button class="btn-ctrl minus" onclick="changeMod(-1)"></button>
                <span class="ctrl-value" id="modDisplay">+0</span>
                <button class="btn-ctrl plus" onclick="changeMod(1)"></button>
            </div>
        </div>
    </div>

    <div class="snackbar" id="snackbar"></div>

    <div class="modal-overlay" id="modalCreate">
        <div class="modal-card">
            <div class="modal-header">
                <div class="icon">+</div>
                <span>CRIAR DADO PERSONALIZADO</span>
            </div>

            <div class="form-group">
                <label class="modal-label">NOME DO DADO</label>
                <input type="text" id="custName" placeholder="Ex: d30, d1000">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="modal-label">NÚMERO DE FACES</label>
                    <input type="number" id="custMax" placeholder="Ex: 30">
                </div>
                <div class="form-group">
                    <label class="modal-label">VALOR MÍNIMO</label>
                    <input type="number" id="custMin" placeholder="Ex: 1">
                </div>
            </div>

            <button class="btn-orange" onclick="saveCustomDice()">SALVAR DADO</button>
            <button class="btn-orange" style="background:#555555; color:#fff; margin-top:10px;" onclick="closeModal('modalCreate')">CANCELAR</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalSettings">
        <div class="modal-card">
            <div class="modal-header">
                <span>CONFIGURAÇÕES</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <span style="font-size:0.95rem; color: #fff;">Sorteio sem repetição</span>
                <input type="checkbox" id="noRepeatCheck" style="width:22px; height:22px;" onchange="toggleNoRepeat(this.checked)">
            </div>
            <button class="btn-orange" style="background:#555555; color:#fff;" onclick="closeModal('modalSettings')">FECHAR</button>
        </div>
    </div>
</div>

    };

    let diceList = [
        { name: 'd4', min: 3, max: 4, type: 'd4' },
        { name: 'd6', min: 4, max: 6, type: 'd6' },
        { name: 'd8', min: 5, max: 8, type: 'd8' },
        { name: 'd10', min: 7, max: 10, type: 'd10' }, 
        { name: 'd12', min: 8, max: 12, type: 'd12' },
        { name: 'd20', min: 10, max: 20, type: 'd20' },
        { name: 'd100', min: 43, max: 100, type: 'd100' }
    ];

    let diceCount = 1;
    let modifier = 0;
    let noRepeat = false;
    let historyLogs = [];

    function renderGrid() {
        const grid = document.getElementById('diceGrid');
        grid.innerHTML = '';
        diceList.forEach((dice, index) => {
            const item = document.createElement('div');
            item.className = 'dice-item';
            item.setAttribute('data-type', dice.type);
            item.onclick = () => rollDice(index);
            
            const imgSrc = diceImages[dice.type] || diceImages.customCube;
            item.innerHTML = `<img src="${imgSrc}" alt="${dice.name}" class="dice-img"><span class="dice-label">${dice.name}</span>`;
            grid.appendChild(item);
        });
    }

    function changeCount(val) {
        diceCount = Math.max(1, diceCount + val);
        document.getElementById('countDisplay').innerText = `${diceCount}d`;
    }

    function changeMod(val) {
        modifier += val;
        document.getElementById('modDisplay').innerText = `${modifier >= 0 ? '+' : ''}${modifier}`;
    }

    function toggleMenu(e) {
        e.stopPropagation();
        const menu = document.getElementById('menuPop');
        menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    document.addEventListener('click', () => {
        document.getElementById('menuPop').style.display = 'none';
    });

    function openCreateDiceModal() { document.getElementById('modalCreate').style.display = 'flex'; }
    function openSettingsModal() { document.getElementById('modalSettings').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleNoRepeat(val) { noRepeat = val; }

    let snackTimer = null;
    function showSnackbar(msg) {
        const bar = document.getElementById('snackbar');
        bar.innerText = msg;
        bar.classList.add('show');
        clearTimeout(snackTimer);
        snackTimer = setTimeout(() => bar.classList.remove('show'), 2000);
    }

    function clearHistory() {
        historyLogs = [];
        updateHistoryUI();
        showSnackbar('Histórico apagado');
    }

    function saveCustomDice() {
        const name = document.getElementById('custName').value.trim();
        const max = parseInt(document.getElementById('custMax').value);
        let min = parseInt(document.getElementById('custMin').value);

        if (!name || isNaN(max)) return alert('Preencha o Nome e o Número de Faces!');
        if (isNaN(min) || min < 1) min = 1;
        if (min > max) return alert('O Valor Mínimo não pode ultrapassar as Faces!');

        diceList.push({ name: name, min: min, max: max, type: 'customCube' });
        renderGrid();
        closeModal('modalCreate');

        document.getElementById('custName').value = '';
        document.getElementById('custMax').value = '';
        document.getElementById('custMin').value = '1';
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function rollDice(index) {
        const dice = diceList[index];
        const possibleCount = (dice.max - dice.min + 1);

        if (noRepeat && diceCount > possibleCount) {
            alert(`Sorteio sem repetição impossível! O dado ${dice.name} só possui ${possibleCount} números disponíveis.`);
            return;
        }

        let rolls = [];
        if (noRepeat) {
            let pool = [];
            for (let i = dice.min; i <= dice.max; i++) pool.push(i);
            for (let i = 0; i < diceCount; i++) {
                let rIdx = getRandomInt(0, pool.length - 1);
                rolls.push(pool[rIdx]);
                pool.splice(rIdx, 1);
            }
        } else {
            for (let i = 0; i < diceCount; i++) {
                rolls.push(getRandomInt(dice.min, dice.max));
            }
        }

        const sum = rolls.reduce((a, b) => a + b, 0);
        const total = sum + modifier;

        document.getElementById('resHeader').innerText = `${diceCount}${dice.name}`;
        document.getElementById('resMain').innerText = total;
        
        let footerText = rolls.join(', ');
        if (modifier !== 0) {
            footerText += ` (${modifier >= 0 ? '+' : ''}${modifier})`;
        }
        document.getElementById('resFooter').innerText = footerText;
        
        document.getElementById('resultOverlay').style.display = 'flex';

        const now = new Date();
        const timeString = now.toTimeString().split(' ')[0];

        historyLogs.unshift({
            title: `${diceCount}${dice.name} ${modifier !== 0 ? (modifier >= 0 ? '+' + modifier : modifier) : ''}`,
            rolls: rolls.join(', '),
            total: total,
            time: timeString
        });
        updateHistoryUI();
    }

    function closeResult() {
        document.getElementById('resultOverlay').style.display = 'none';
    }

    function switchTab(tab) {
        document.getElementById('tabMesa').classList.toggle('active', tab === 'mesa');
        document.getElementById('tabHist').classList.toggle('active', tab === 'historico');
        document.getElementById('mesaView').style.display = (tab === 'mesa') ? 'block' : 'none';
        document.getElementById('historicoView').style.display = (tab === 'historico') ? 'block' : 'none';
    }

    function updateHistoryUI() {
        const list = document.getElementById('historyList');
        if (historyLogs.length === 0) {
            list.innerHTML = '<div style="text-align:center; color: var(--text-sub); margin-top:30px; font-size: 1rem;">Nenhuma rolagem realizada.</div>';
            return;
        }
        list.innerHTML = '';
        historyLogs.forEach(log => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-left">
                    <div class="history-total-box">${log.total}</div>
                    <div class="history-info">
                        <span class="history-title">${log.title}</span>
                        <span class="history-rolls">${log.rolls}</span>
                    </div>
                </div>
                <div class="history-time">${log.time}</div>
            `;
            list.appendChild(item);
        });
    }

    renderGrid();
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }
</script>
